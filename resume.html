<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Resume</title>
  <!-- No external font imports needed — using system fonts -->

  <style>
    /* ╔══════════════════════════════════════════════════════════════╗
       ║         🎨  DESIGN TOKENS — matches index.html exactly        ║
       ╚══════════════════════════════════════════════════════════════╝ */
    :root {
      --bg:        #f2f5f0;
      --ink:       #1a1a18;
      --muted:     #808883;
      --accent:    #029e24;
      --card-bg:   #e0e8e1;
      --radius:    2px;
      --display:   'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif;
      --sans:      -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      --transition: 380ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* ── NAV — identical to index.html ─────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px clamp(20px, 5vw, 60px) 20px;
      border-bottom: 1px solid rgba(26,26,24,0.10);
    }
    .nav-name {
      font-family: var(--display);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-links a { color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover,
    .nav-links a.active { color: var(--ink); }

    /* ── PAGE ───────────────────────────────────────────────── */
    .page {
      max-width: 860px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) clamp(20px, 5vw, 60px) clamp(80px, 12vw, 140px);
    }

    .page-header {
      margin-bottom: clamp(40px, 6vw, 72px);
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.5s 0.05s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }

    .page-header h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .page-header p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 480px;
    }

    /* ── RESUME CARDS ───────────────────────────────────────── */
    .resume-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(16px, 2.5vw, 28px);
    }
    @media (max-width: 600px) { .resume-grid { grid-template-columns: 1fr; } }

    /* ✏️ YOUR EDITS HERE — this card is now background-free by design.
       If you ever want the boxed/shaded look back, re-add:
       background: var(--card-bg); padding: clamp(28px, 4vw, 44px); */
    .resume-card {
      display: flex;
      flex-direction: column;
      gap: 20px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .resume-card:nth-child(1) { animation-delay: 0.12s; }
    .resume-card:nth-child(2) { animation-delay: 0.20s; }

    /* ── RESUME THUMBNAIL (the actual page image, 4:5 portrait) ── */
    .resume-thumb {
      display: block;
      aspect-ratio: 4 / 5;
      width: 100%;
      max-width: 260px;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background: #ffffff;
      border: 1px solid rgba(26,26,24,0.10);
      align-self: flex-start;
    }
    .resume-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s var(--transition);
    }
    .resume-thumb:hover img { transform: scale(1.03); }

    /* Placeholder shown until you add a real image — see YOUR EDITS HERE below */
    .resume-thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: var(--sans);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    /* Small "click to view/download" hint under the thumbnail */
    .resume-thumb-hint {
      margin-top: 10px;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .resume-card h2 {
      font-family: var(--display);
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .resume-card p {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    /* Divider */
    .resume-card-divider {
      height: 1px;
      background: rgba(26,26,24,0.12);
    }

    /* Download button */
    .resume-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      border: 1px solid rgba(26,26,24,0.25);
      border-radius: 100px;
      padding: 10px 20px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      align-self: flex-start;
    }
    .resume-download:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }
    .resume-download svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .resume-download:hover svg { transform: translateY(2px); }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid rgba(26,26,24,0.10);
      padding: 32px clamp(20px, 5vw, 60px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    footer a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>

  <!-- ✏️ YOUR INFO — keep in sync with index.html -->
  <nav>
    <a class="nav-name" href="index.html">Josh Newman</a>
    <div class="nav-links">
      <a href="index.html">Work</a>
      <a href="resume.html" class="active">Resume</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="page">

    <div class="page-header">
      <h1>Resume</h1>
    </div>

    <div class="resume-grid">

      <!-- ══════════════════════════════════════════════════════
           ✏️ YOUR EDITS HERE — DESIGNED RESUME (Version 01)

           TO MAKE THIS DOWNLOAD YOUR REAL PDF:
           1. In VS Code, drop your PDF file into the `resumes/`
              folder (create the folder next to index.html if it
              doesn't exist yet).
           2. Name the file exactly:  resume-designed.pdf
              (or rename it to whatever you like, just make sure
              BOTH href="resumes/resume-designed.pdf" attributes
              below match the real filename — there are two,
              one on the image link and one on the button).
           3. That's it — no other code changes needed. Clicking
              EITHER the image or the "Download PDF" button
              triggers a real file download, because both are
              <a> tags pointing at the same PDF with a `download`
              attribute already built in.
           4. Image: swap the img src below for a screenshot/export
              of the PDF's first page (roughly 4:5 portrait,
              e.g. 1000 x 1250px) so the thumbnail matches.
           ══════════════════════════════════════════════════════ -->
      <div class="resume-card">

        <!-- Click the image itself to download the PDF -->
        <a class="resume-thumb" href="resumes/resume-designed.pdf" download="Josh-Newman-Designed-Resume.pdf">
          <!-- ✏️ Replace this img src with your resume image -->
          <img src="images/res1.png" alt="Designed resume preview" loading="lazy"
               onerror="this.parentElement.innerHTML='<div class=\'resume-thumb-placeholder\'>Add image at<br>images/resume-designed.jpg</div>'" />
        </a>

        <h2>Designed<br />Resume</h2>

        <!-- ✏️ Same PDF path as the image link above — keep both in sync -->
        <a class="resume-download" href="resumes/resume-designed.pdf" download="Josh-Newman-Designed-Resume.pdf">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download PDF
        </a>
      </div>

      <!-- ══════════════════════════════════════════════════════
           ✏️ YOUR EDITS HERE — ATS RESUME (Version 02)
           Same steps as above — drop this one in as
           resumes/resume-ats.pdf
           ══════════════════════════════════════════════════════ -->
      <div class="resume-card">

        <a class="resume-thumb" href="resumes/resume-ats.pdf" download="Josh-Newman-ATS-Resume.pdf">
          <!-- ✏️ Replace this img src with your resume image -->
          <img src="images/res2.png" alt="ATS-friendly resume preview" loading="lazy"
               onerror="this.parentElement.innerHTML='<div class=\'resume-thumb-placeholder\'>Add image at<br>images/resume-ats.jpg</div>'" />
        </a>

        <h2>ATS-Friendly<br />Resume</h2>

        <!-- ✏️ Same PDF path as the image link above — keep both in sync -->
        <a class="resume-download" href="resumes/resume-ats.pdf" download="Josh-Newman-ATS-Resume.pdf">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download PDF
        </a>
      </div>

    </div>

  </div>

  <footer>
    <span>© 2026 Josh Newman</span>
    <span>
      <a href="https://www.linkedin.com/in/joshlowenewman/" target="_blank">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/joshualowenewman-code" target="_blank">GitHub</a>
    </span>
  </footer>

</body>
</html>
