<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Contact</title>

  <style>
    /* ╔══════════════════════════════════════════════════════════════╗
       ║         🎨  DESIGN TOKENS — keep in sync with index.html     ║
       ╚══════════════════════════════════════════════════════════════╝ */
    :root {
      --bg:        #f2f5f0;
      --ink:       #1a1a18;
      --muted:     #808883;
      --accent:    #029e24;
      --card-bg:   #e0e8e1;
      --radius:    2px;
      --display:   'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif;
      --sans:      -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      --transition: 380ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ── NAV ─────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px clamp(20px, 5vw, 60px) 20px;
      border-bottom: 1px solid rgba(26,26,24,0.10);
    }
    .nav-name {
      font-family: var(--display);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-links a { color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover,
    .nav-links a.active { color: var(--ink); }

    /* ── PAGE ────────────────────────────────────────────────── */
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: clamp(48px, 8vw, 96px) clamp(20px, 5vw, 60px) clamp(80px, 12vw, 140px);
      flex: 1;
    }

    @keyframes fadeUp { to { opacity: 1; transform: none; } }
    .animate {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.55s var(--transition) forwards;
    }

    /* ── PAGE HEADER ─────────────────────────────────────────── */
    .page-header {
      margin-bottom: clamp(52px, 8vw, 88px);
      animation-delay: 0.05s;
    }
    .page-header h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .page-header .intro {
      font-size: clamp(0.9rem, 1.3vw, 1rem);
      color: var(--muted);
      line-height: 1.7;
      max-width: 460px;
    }

    /* ── CONTACT LIST ────────────────────────────────────────── */
    .contact-list {
      display: flex;
      flex-direction: column;
      /* Each row separated by a hairline */
    }

    .contact-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(20px, 3vw, 28px) 0;
      border-top: 1px solid rgba(26,26,24,0.10);
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s var(--transition) forwards;
    }
    .contact-row:last-child { border-bottom: 1px solid rgba(26,26,24,0.10); }

    .contact-row:nth-child(1) { animation-delay: 0.10s; }
    .contact-row:nth-child(2) { animation-delay: 0.17s; }
    .contact-row:nth-child(3) { animation-delay: 0.24s; }
    .contact-row:nth-child(4) { animation-delay: 0.31s; }

    .contact-label {
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
      width: 100px;
    }

    .contact-value {
      font-family: var(--display);
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      font-weight: 300;
      letter-spacing: -0.01em;
      color: var(--ink);
      transition: color 0.2s;
    }
    .contact-value:hover { color: var(--muted); }

    /* Arrow on hover */
    .contact-arrow {
      font-size: 0.8rem;
      color: var(--accent);
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.2s, transform 0.2s, color 0.2s;
    }
    .contact-row:hover .contact-arrow {
      opacity: 1;
      transform: none;
    }

    /* ── COPY-TO-CLIPBOARD ROWS (email / phone) ────────────── */
    button.contact-row {
      background: none;
      border: none;
      border-top: 1px solid rgba(26,26,24,0.10);
      width: 100%;
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }
    .contact-row.row-copied .contact-arrow {
      opacity: 1;
      transform: none;
      color: var(--accent);
    }

    /* ── FOOTER ──────────────────────────────────────────────── */
    footer {
      border-top: 1px solid rgba(26,26,24,0.10);
      padding: 32px clamp(20px, 5vw, 60px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    footer a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>

  <!-- ✏️ YOUR INFO -->
  <nav>
    <a class="nav-name" href="index.html">Josh Newman</a>
    <div class="nav-links">
      <a href="index.html">Work</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <div class="page">

    <div class="page-header animate">
      <h1>Contact</h1>
    </div>

    <div class="contact-list">

      <!-- ✏️ Email & Phone copy their value to the clipboard on click.
           LinkedIn is the only row that actually navigates. -->

      <button type="button" class="contact-row" data-copy="new21012@byui.edu">
        <span class="contact-label">Email</span>
        <span class="contact-value">new21012@byui.edu</span>
        <span class="contact-arrow">Copy</span>
      </button>

      <!-- ✏️ Replace href/text if your LinkedIn handle changes -->
      <a class="contact-row" href="https://www.linkedin.com/in/joshlowenewman/" target="_blank">
        <span class="contact-label">LinkedIn</span>
        <span class="contact-value">linkedin.com/in/joshlowenewman</span>
        <span class="contact-arrow">↗</span>
      </a>

      <button type="button" class="contact-row" data-copy="+1 (801) 674-1970">
        <span class="contact-label">Phone</span>
        <span class="contact-value">+1 (801) 674-1970</span>
        <span class="contact-arrow">Copy</span>
      </button>

      

    </div>

  </div><!-- /page -->

  <footer>
    <span>© 2026 Your Name</span>
    <span>
      <a href="https://www.linkedin.com/in/joshlowenewman/" target="_blank">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/joshualowenewman-code" target="_blank">GitHub</a>
    </span>
  </footer>

  <script>
    // Email & Phone rows: copy value to clipboard and show a "Copied" signifier
    document.querySelectorAll('.contact-row[data-copy]').forEach(row => {
      const indicator = row.querySelector('.contact-arrow');
      const defaultText = indicator.textContent;
      let revertTimeout;

      row.addEventListener('click', async () => {
        const value = row.dataset.copy;
        try {
          await navigator.clipboard.writeText(value);
        } catch (err) {
          // Fallback for browsers without Clipboard API permission
          const temp = document.createElement('textarea');
          temp.value = value;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
        }

        indicator.textContent = 'Copied ✓';
        row.classList.add('row-copied');

        clearTimeout(revertTimeout);
        revertTimeout = setTimeout(() => {
          indicator.textContent = defaultText;
          row.classList.remove('row-copied');
        }, 1500);
      });
    });
  </script>

</body>
</html>
