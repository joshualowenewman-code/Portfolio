<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Josh Newman — Portfolio</title>
  <!-- No external font imports needed — using system fonts -->

  <style>
    /* ╔══════════════════════════════════════════════════════════════╗
       ║         🎨  DESIGN TOKENS — YOUR STYLE CONTROL PANEL         ║
       ║  Change these values to restyle the whole site at once.      ║
       ╚══════════════════════════════════════════════════════════════╝ */
    :root {
      --bg:        #f2f5f0;
      --ink:       #1a1a18;
      --muted:     #808883;
      --accent:    #029e24;
      --card-bg:   #e0e8e1;
      --gap:       clamp(12px, 1.5vw, 20px);
      --col:       3;
      --radius:    2px;
      /* H1 & H2 — Helvetica Neue */
      --display:   'Helvetica Neue', HelveticaNeue, Helvetica, Arial, sans-serif;
      /* H3 & H4, body — SF Pro (system font on Apple; falls back gracefully) */
      --sans:      -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      --transition: 380ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* ── NAV ────────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 28px clamp(20px, 5vw, 60px) 20px;
      border-bottom: 1px solid rgba(26,26,24,0.10);
    }
    .nav-name {
      font-family: var(--display);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-links a {
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--ink); }

    /* ── HERO ───────────────────────────────────────────────── */
    .hero {
      padding: clamp(48px, 8vw, 96px) clamp(20px, 5vw, 60px) clamp(32px, 5vw, 56px);
    }
    .hero h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.02em;
      max-width: 720px;
    }
    .hero h1 em {
      font-style: normal;
      font-weight: 200;
      color: var(--muted);
    }

    /* ── FILTER BAR ─────────────────────────────────────────── */
    .filter-bar {
      padding: 0 clamp(20px, 5vw, 60px) 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: none;
      border: 1px solid rgba(26,26,24,0.20);
      border-radius: 100px;
      padding: 5px 16px;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    /* ── GRID ───────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(var(--col), 1fr);
      gap: var(--gap);
      padding: 0 clamp(20px, 5vw, 60px) clamp(60px, 10vw, 120px);
    }
    @media (max-width: 900px) { :root { --col: 2; } }
    @media (max-width: 560px) { :root { --col: 1; } }

    /* ── CARD ───────────────────────────────────────────────── */
    .card {
      display: block;
      position: relative;
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.55s var(--transition) forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: none; }
    }

    /* Uniform 4:3 thumbnail */
    .card-thumb {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      position: relative;
    }
    .card-thumb img {
      transition: transform 0.55s var(--transition);
    }
    .card:hover .card-thumb img {
      transform: scale(1.04);
    }

    /* Placeholder when no image */
    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      padding: 32px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    /* Overlay on hover */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26,26,24,0.72);
      display: flex;
      align-items: flex-end;
      padding: 24px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .card:hover .card-overlay { opacity: 1; }
    .card-overlay-text {
      color: #f5f4f0;
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 300;
      line-height: 1.5;
    }

    /* Meta below card — H3/H4 level: SF Pro */
    .card-meta {
      padding: 14px 0 0;
    }
    .card-title {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .card-sub {
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .card-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 100px;
    }

    /* Hidden cards (filtered out) */
    .card.hidden {
      display: none;
    }

    /* ── FOOTER ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid rgba(26,26,24,0.10);
      padding: 32px clamp(20px, 5vw, 60px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    footer a { border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
    footer a:hover { color: var(--ink); }

    /* ── STAGGER DELAYS ─────────────────────────────────────── */
    .card:nth-child(1)  { animation-delay: 0.05s; }
    .card:nth-child(2)  { animation-delay: 0.10s; }
    .card:nth-child(3)  { animation-delay: 0.15s; }
    .card:nth-child(4)  { animation-delay: 0.20s; }
    .card:nth-child(5)  { animation-delay: 0.25s; }
    .card:nth-child(6)  { animation-delay: 0.30s; }
    .card:nth-child(7)  { animation-delay: 0.35s; }
    .card:nth-child(8)  { animation-delay: 0.40s; }
    .card:nth-child(9)  { animation-delay: 0.45s; }
    .card:nth-child(10) { animation-delay: 0.50s; }
    .card:nth-child(11) { animation-delay: 0.55s; }
    .card:nth-child(12) { animation-delay: 0.60s; }
  </style>
</head>
<body>

  <!-- ✏️ YOUR INFO — edit name, links, and tagline below -->
  <!-- NAV -->
  <nav>
    <a class="nav-name" href="#">Josh Newman</a>
    <div class="nav-links">
      <a href="index.html" class="active">Work</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero" id="work">
    <h1>Welcome.<br /><em>Please, have a look around.</em></h1>
  </section>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <!-- additional filter buttons injected by JS -->
  </div>

  <!-- PROJECT GRID -->
  <main class="grid" id="grid"></main>

  <!-- FOOTER -->
  <footer>
    <span>© 2026 Josh Newman</span>
    <span>
      <a href="https://www.linkedin.com/in/joshlowenewman/" target="_blank">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/joshualowenewman-code" target="_blank">GitHub</a>
    </span>
  </footer>

  <script>
    // ╔══════════════════════════════════════════════════════════════╗
    // ║              ✏️  YOUR CONTENT — EDIT HERE                    ║
    // ╠══════════════════════════════════════════════════════════════╣
    // ║  Each project is one {} block. Fields:                       ║
    // ║  title  — project name (shown below card + on hover)         ║
    // ║  sub    — discipline · year  e.g. "Brand Identity · 2025"    ║
    // ║  tag    — category for filtering (make up your own)          ║
    // ║  desc   — one sentence shown on hover overlay                ║
    // ║  image  — relative path e.g. "images/myproject.jpg"          ║
    // ║           Leave as "" to show a text placeholder             ║
    // ║  link   — URL to open on click, or "#" for no link           ║
    // ╚══════════════════════════════════════════════════════════════╝
    const projects = [
      {
        title: "Designing a Faculty Hub",
        sub: "UX Design · 2025",
        tag: "UX/UI",
        desc: "Building a centralized platform for university faculty to access resources and track success.",
        image: "images/facultydash.png",
        link: "https://www.figma.com/proto/BRMog5BSFR0vvC490dHqpL/UX-class-W.2026?node-id=340-230&viewport=-196%2C226%2C0.11&t=ligAg8W7xXtfUDF9-1&scaling=min-zoom&content-scaling=fixed&starting-point-node-id=340%3A230&page-id=340%3A2",
      },
      {
        title: "Banking UI: Designing Within a System",
        sub: "UI Design · 2025",
        tag: "UX/UI",
        desc: "Creating an interface layout using existing assets.",
        image: "images/Bank2.png",
        link: "https://www.figma.com/proto/cplAghXR4EnT2uL3W2f0P5/Bank-Case-Study?node-id=144-36&viewport=-65%2C261%2C0.22&t=e6dZ0sSxMXyuaZyR-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1"
      },
      {
        title: "OneRepublic Poster Design",
        sub: "Branding Design · 2025",
        tag: "Branding",
        desc: "",
        image: "images/OR.png",
        link: "https://www.figma.com/proto/Z3KquBFOuOqXIdtzewavA2/OneRepublic-Case-Study?node-id=1-2&viewport=53%2C241%2C0.26&t=pOvzfnID7eyhX0JF-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1",
      },
      {
        title: "KalorieTrak",
        sub: "UI Design · 2025",
        tag: "UX/UI",
        desc: "Interface design for a calorie tracking app",
        image: "images/kalorietrak.png",
        link: "https://www.figma.com/proto/qBtGw98OSISIJ9z2Lf0o6E/KT-Case-Study?node-id=162-11&viewport=237%2C293%2C0.05&t=4AdRU7mqPamLLxhY-1&scaling=min-zoom&content-scaling=fixed&starting-point-node-id=1%3A2&page-id=0%3A1&hotspot-hints=0",
      },
      {
        title: "AR Interface Case Study",
        sub: "UI Design · 2025",
        tag: "UX/UI",
        desc: "Augmented reality visualized through a simple interface.",
        image: "images/Misobroth.png",
        link: "https://www.figma.com/proto/oGopBfUsMCl72G1y1POvf2/AR-Case-Study?node-id=11-3&page-id=0%3A1&t=Qycnnhf3pD2ymp2H-1",
      },
      {
        title: "Madison High Yearbook Ad",
        sub: "Editorial Design · 2025",
        tag: "Editorial Design",
        desc: "University promoting editorial high school yearbook ad for prospective students.",
        image: "images/yearbookhero.png",
        link: "https://www.figma.com/proto/5lyS3qc8p1vpAmED9ZrSsu/Yearbook-ad-case-study?node-id=1-2&viewport=103%2C227%2C0.37&t=rJTvJJnAPW7u2puJ-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1",
      },
      {
        title: "Cafe Moderna Logotype",
        sub: "Branding · 2025",
        tag: "Branding",
        image: "images/Cafe.png",
        desc: "",
        link: "https://www.figma.com/proto/yDVorHqUBC5l0U83tzq164/Cafe-Moderna-Case-Study?node-id=1-2&p=f&viewport=98%2C207%2C0.38&t=FbqMMW7nFRqHc0Ij-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1",
      },
      {
        title: "AboutFace Type Design",
        sub: "Type Design · 2025",
        tag: "Typography",
        desc: "Typographic Designs utilizing constraints of weight, size, and shape.",
        image: "images/AB.png",
        link: "https://www.figma.com/proto/9yYwMhyNqLlB8cRguINOAS/AboutFace-Type-Case-Study?node-id=1-2&viewport=81%2C145%2C0.41&t=vZFlx0da8S0RFuDn-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1",
      },
      {
        title: "Wonder Magazine",
        sub: "Editorial Design · 2025",
        tag: "Editorial Design",
        desc: "Typographic Editoral Design in magazine format.",
        image: "images/Mag.png",
        link: "https://www.figma.com/proto/78wtGQobEV4a5C2x8Bn4iz/Magazine-Case-Study?node-id=1-2&viewport=80%2C187%2C0.34&t=xZLdbjPb0T7bD7UF-1&scaling=min-zoom&content-scaling=fixed&page-id=0%3A1",
      },
      
    ];
    // ╔══════════════════════════════════════════════════════════════╗
    // ║         ✏️  END OF YOUR CONTENT — DON'T EDIT BELOW           ║
    // ╚══════════════════════════════════════════════════════════════╝

    const grid = document.getElementById("grid");
    const filterBar = document.getElementById("filter-bar");

    // Collect unique tags
    const tags = [...new Set(projects.map(p => p.tag))];
    tags.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "filter-btn";
      btn.dataset.filter = tag;
      btn.textContent = tag;
      filterBar.appendChild(btn);
    });

    // Render cards
    projects.forEach((p, i) => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = p.link;
      card.dataset.tag = p.tag;
      if (p.link && p.link !== "#") card.target = "_blank";
      card.style.animationDelay = `${0.05 + i * 0.05}s`;

      const thumbContent = p.image
        ? `<img src="${p.image}" alt="${p.title}" loading="lazy" />`
        : `<div class="card-placeholder">${p.title}</div>`;

      card.innerHTML = `
        <div class="card-thumb">
          ${thumbContent}
          <div class="card-overlay">
            <p class="card-overlay-text">${p.desc}</p>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-title">${p.title}</div>
          <div class="card-sub">${p.sub}</div>
          <span class="card-tag">${p.tag}</span>
        </div>
      `;

      grid.appendChild(card);
    });

    // Filter logic
    filterBar.addEventListener("click", e => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;

      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const filter = btn.dataset.filter;
      document.querySelectorAll(".card").forEach(card => {
        const match = filter === "all" || card.dataset.tag === filter;
        card.classList.toggle("hidden", !match);
      });
    });
  </script>
</body>
</html>
